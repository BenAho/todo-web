<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos</title>

    <link rel="stylesheet" href="./dist/main.css" type="text/css"/>
</head>
<body>
    <header class="header">
        <div class="header__container">
            <nav class="navigation">
                <ul>
                    <li class="navigation__list-item">
                        <a class="navigation__list-item-link" href="#">Todo</a>
                    </li>
                    <li class="navigation__list-item">
                        <a class="navigation__list-item-link" href="#">About Us</a>
                    </li>
                    <li class="navigation__list-item">
                        <a class="navigation__list-item-link" href="#">Light/Night Mode</a>
                    </li>
                    <li class="navigation__list-item">
                        <a class="navigation__list-item-link" href="#">Sidebar</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="home">
        <div class="home__container">
            <div class="home__container-todo-status">
                <div>
                    <h1>Todo Done</h1>
                    <p>keep it up</p>
                </div>
                <div class="progress">
                    <div class="progress__status">
                        <span class="progress__status-current">2</span>/<span class="progress__status-total">3</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="home__container-todo-row">
            <div class="home__container-todo-left">

                <div class="home__container-todo-controls">
                    <input id="add-todo-input" class="home__container-todo-input" type="text" placeholder="write your next task">
                    <button id="add-todo-button" class="button"></button>
                </div>
                <div class="home__container-todo">
                    <div id="add-todo-result" class="home__container-todo-scroll">
                        <template id="todo-item-template">
                            <div  class="home__container-todo-list">
                                <input type="checkbox" class="checkbox-done"></input>
                                <div class="todo-list-text"></div>
                                <button type="button" class="button-edit">
                                    <svg class="icon-edit">
                                        <use href="images/icons.svg#icon-edit" />
                                    </svg>
                                </button>
                                <button type="button" class="button-del">
                                    <svg class="icon-del">
                                        <use href="images/icons.svg#icon-del" />
                                    </svg>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <div class="home__container-todo-right">
                <div class="home__container-todo-search">
                    <input class="home__container-todo-input" type="text" placeholder="search after your task">
                </div>
                <div class="home__container-todo-search-results">
                    result
                </div>
            </div>
        </div>
    </section>
    <footer class="">
    </footer>

    <script type="module" src="./src/index.js"></script>
</body>
</html>
